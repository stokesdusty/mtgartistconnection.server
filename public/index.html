<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Dark is the default theme; only an explicit 'light' opts out (keep in sync with ColorModeContext.tsx) -->
    <script>try{if(localStorage.getItem('color-mode')!=='light'){document.documentElement.dataset.dark=''}}catch(e){document.documentElement.dataset.dark=''}</script>
    <!-- Pre-paint background only; the full token set is injected from src/styles/design-tokens.ts -->
    <style>
      html, body { background-color: #f5f2ed; color: #1a1714; }
      html[data-dark], html[data-dark] body { background-color: #0f0e0d; color: #f3efe9; }
    </style>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0e0d" />
    <meta name="description" content="Connecting fans with their favorite Magic: The Gathering artists. Browse artist profiles, signing events, and card art." />
    <meta name="impact-site-verification" value="e3c981f6-4b01-41cf-8f5b-e7815b2c30ec" />
    <!-- Canonical fallback (overridden per-page by PageMeta / react-helmet-async) -->
    <link rel="canonical" href="https://www.mtgartistconnection.com/" />
    <!-- Open Graph defaults (overridden per-page by PageMeta / react-helmet-async) -->
    <meta property="og:title" content="MtG Artist Connection | Magic: The Gathering Artists" />
    <meta property="og:description" content="Connecting fans with their favorite Magic: The Gathering artists. Browse artist profiles, signing events, and card art." />
    <meta property="og:url" content="https://www.mtgartistconnection.com" />
    <meta property="og:image" content="https://www.mtgartistconnection.com/logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MtG Artist Connection" />
    <meta property="og:locale" content="en_US" />
    <!-- X (Twitter) Card defaults (overridden per-page by PageMeta / react-helmet-async) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MtG Artist Connection | Magic: The Gathering Artists" />
    <meta name="twitter:description" content="Connecting fans with their favorite Magic: The Gathering artists. Browse artist profiles, signing events, and card art." />
    <meta name="twitter:image" content="https://www.mtgartistconnection.com/logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- Google tag (gtag.js) is loaded at runtime by CookieConsentBanner only after the user accepts analytics cookies -->
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>MtG Artist Connection</title>

    <!-- Preconnect: third-party origins -->
    <link rel="preconnect" href="https://d25ut0vhqgdazl.cloudfront.net" crossorigin />
    <link rel="preconnect" href="https://mtgartistconnectionwebservice-production.up.railway.app" />
    <link rel="dns-prefetch" href="https://api.scryfall.com" />

    <!-- Fonts: Geist (UI + headings) + Geist Mono (labels) — loaded async to avoid render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" /></noscript>

    <!-- Structured Data: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.mtgartistconnection.com/#organization",
          "name": "MtG Artist Connection",
          "url": "https://www.mtgartistconnection.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.mtgartistconnection.com/logo.png"
          },
          "description": "Connecting fans with their favorite Magic: The Gathering artists. Browse artist profiles, signing events, and card art.",
          "sameAs": [
            "https://bsky.app/profile/mtgartistconnect.bsky.social"
          ],
          "founder": {
            "@type": "Person",
            "name": "Dustin Stokes",
            "email": "stokes.dusty@gmail.com"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.mtgartistconnection.com/#website",
          "name": "MtG Artist Connection",
          "url": "https://www.mtgartistconnection.com",
          "publisher": {
            "@id": "https://www.mtgartistconnection.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.mtgartistconnection.com/?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
